# offload: runs one job from compute/offload.py (F:\Claude-Video-Lab) across many GitHub runners.
# Started only by offload.py (workflow_dispatch). Job files and results are AES-256 encrypted: the job manifest is unlocked
# with the FARM_KEY secret, results are locked with a per-job key, so this public repo shows locked blobs and progress lines only.
name: offload
run-name: offload ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job id (offload.py sets it)"
        required: true
      machines:
        description: "JSON list of machine indexes, e.g. [0,1,2]"
        required: true
      python:
        description: "Python version"
        required: false
        default: "3.13"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        machine: ${{ fromJson(inputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: offload
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
      - name: Run machine ${{ matrix.machine }}
        env:
          OFFLOAD_KEY: ${{ secrets.FARM_KEY }}
        run: |
          python -m pip install -q --disable-pip-version-check cryptography
          python offload/runner.py --machine ${{ matrix.machine }} --root "$RUNNER_TEMP/w" --out "$RUNNER_TEMP/out" --encrypt-result \
            --manifest-url "https://github.com/${{ github.repository }}/releases/download/offload-store/job-${{ inputs.job }}.ofl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.machine }}
          path: ${{ runner.temp }}/out/result.ofl
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
